services:
  - type: web
    name: dsa-insights
    runtime: docker
    plan: free
    autoDeploy: true
    # Render injects PORT=10000 by default, which would override the app's
    # default of 3001. Pinning both keeps the app, Render's port scanner and
    # the Dockerfile EXPOSE 3001 in agreement instead of silently 502ing.
    port: 3001
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3001"
      - key: GROQ_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
        # Optional: used only at build time to enable Clerk auth. Leave blank to run without auth.
services:
  - type: web
    name: dsa-insights
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # Render injects PORT=10000 by default, which would override the app's
      # default of 3001. Pinning it keeps the app, Render's port scanner and
      # the Dockerfile EXPOSE 3001 in agreement instead of 502ing.
      - key: PORT
        value: "3001"
      - key: GROQ_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
        # Optional: used only at build time to enable Clerk auth. Leave blank to run without auth.
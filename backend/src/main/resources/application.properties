server.port=${PORT:3001}

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/dsa_insights}

# Groq AI
groq.api-key=${GROQ_API_KEY:}
groq.model=llama-3.3-70b-versatile
groq.stt-model=whisper-large-v3-turbo

# Code execution
exec.timeout.js=5000
exec.timeout.ts=30000
exec.timeout.python=5000
exec.timeout.cpp=5000
exec.timeout.java=5000
exec.timeout.compile=15000

# Text-to-speech (edge-tts binary path, must be on PATH or absolute)
tts.edge-tts-path=${EDGE_TTS_PATH:edge-tts}

# Uploads (speech-to-text audio)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Match Express json({ limit: '1mb' })
server.tomcat.max-swallow-size=8MB
